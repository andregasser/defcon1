    <radialGradient id="blue-halo"><stop stop-color="#0057d8" stop-opacity=".23"/><stop offset="1" stop-color="#0057d8" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#202c3b"/><stop offset="1" stop-color="#111b27"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8eaac8" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-40%" y="-60%" width="180%" height="240%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
