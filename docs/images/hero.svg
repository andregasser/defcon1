<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">DEFCON 1 — Many projects. One clear view.</title>
  <desc id="description">A dark mission-control illustration with parallel project lanes, five status columns and task cards in the five DEFCON priority colours. Local. Login-free. Yours.</desc>
